name: Feature request
description: Suggest something SpaceSharp should do, or do better.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. The problem you are trying to solve is worth more than a specific solution: there is often a simpler way to get there, and knowing the goal makes it possible to find it.

  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation where SpaceSharp falls short today, in a sentence or two.
      placeholder: I want to find installers I downloaded more than a year ago and never ran, but there is no way to see when a file was last opened.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What SpaceSharp could do
      description: Your idea for how it would work. Rough is fine; a sentence is enough.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: How you handle it today
      description: A workaround, another tool, or "I don't".

  - type: dropdown
    id: area
    attributes:
      label: Part of the app
      options:
        - Scanning (speed, accuracy, what is counted)
        - The map (layout, shading, colors, labels)
        - Zoom and navigation
        - Filter
        - Insights and Safe to clear
        - Changes (comparing scans)
        - Start screen and saved scans
        - Side panel (drives, largest items)
        - Inspect
        - Deleting and cleanup
        - Palettes, themes and looks
        - Settings
        - Shortcuts and keyboard
        - Languages and translations
        - Installer, updates and the command line
        - Something else

  - type: textarea
    id: mockup
    attributes:
      label: Sketches or examples
      description: A drawing, a screenshot from another tool, or a mockup, if you have one. Drag images into this field.

  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: I searched the open and closed issues for this idea
          required: true
