# Blank issues stay allowed for questions and anything the two forms don't cover.
blank_issues_enabled: true
contact_links:
  - name: Questions and ideas
    url: https://github.com/SpaceSharpApp/SpaceSharp/issues/new/choose
    about: Ask how something works, share a palette you made, or talk through a feature. Use the Feature request form, or a blank issue for anything else.
  - name: Website
    url: https://spacesharp.app/
    about: Downloads, screenshots, and the short answers to the usual questions.
  - name: Accessibility
    url: https://github.com/SpaceSharpApp/SpaceSharp/blob/main/ACCESSIBILITY.md
    about: What works with screen readers, keyboard and high contrast, what does not yet, and how to report it.
  - name: Code of conduct
    url: https://github.com/SpaceSharpApp/SpaceSharp/blob/main/CODE_OF_CONDUCT.md
    about: What is expected of everyone here, and how to report a problem privately.
  - name: Security
    url: https://github.com/SpaceSharpApp/SpaceSharp/blob/main/SECURITY.md
    about: How to report a vulnerability privately.
