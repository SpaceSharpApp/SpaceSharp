name: Bug report
description: Something does not work the way it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. A few precise details get a bug fixed far faster than a long description, so the form asks for the ones that matter.

        **Two shortcuts:** the About window (F1) has **Copy version info**, which fills in the version and system fields below in one paste, and if SpaceSharp showed an "Unexpected error" dialog, its **Report on GitHub** button opens this form already filled in. Crash logs are in About › Crash logs.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what went wrong. If an error was shown, paste its text.
      placeholder: "I scanned D:, double-clicked the Games folder, and the map went blank."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered, from a fresh start of the app if you can.
      placeholder: |
        1. Scan drive D:
        2. Double-click "Games"
        3. Press Backspace
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead

  - type: input
    id: version
    attributes:
      label: SpaceSharp version
      description: Shown at the top of the About window (F1).
      placeholder: "2.5.1"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How it was installed
      options:
        - Installer (Setup.exe or MSI)
        - Portable exe
        - Built from source
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: From Copy version info, or Settings › System › About in Windows.
      placeholder: "Windows 11 24H2 (26100), x64"

  - type: dropdown
    id: scan-target
    attributes:
      label: What was being scanned
      options:
        - A whole drive (C:, D:, …)
        - A folder
        - An external or removable drive
        - A network drive or share
        - Not scanning, or does not apply

  - type: dropdown
    id: scan-method
    attributes:
      label: Scan method
      description: The status bar and the scanning card say which one ran. The file table needs administrator rights and an NTFS drive.
      options:
        - File table (fast scan, as administrator)
        - Folder walk
        - A saved scan opened from the start screen
        - Not sure

  - type: textarea
    id: settings
    attributes:
      label: Relevant settings
      description: "Anything that might matter: Color by, palette, size measure, hard-link detection, exclusions, theme, language."
      placeholder: Color by Depth, Graphite palette, size on disk, dark theme, English

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, error text or crash log
      description: Drag images or the crash-*.log file from About › Crash logs into this field.

  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: I am on the latest release, or the issue says which older version
          required: true
        - label: I searched the open and closed issues for this
          required: true
