name: Release

# Builds the Windows release and creates it on GitHub as a draft. Runs when a version tag is pushed (the tag is the
# bare version, "2.3.0", matching <Version> in SpaceSharp.csproj) and by hand from the Actions tab (build and pack
# only, no release). The draft holds every asset unsigned; the code-signing certificate lives on the developer's PC,
# so the last step is there: `.\installer\sign-draft.ps1 -Sign <thumbprint>` downloads the draft's exes and MSIs,
# signs them, uploads them back and rewrites SHA256SUMS.txt. Then the draft is read and published by hand. Installed
# copies only see published releases, so a broken run never reaches anyone.
# When the macOS and Linux packages are ready to ship, release-mac-linux.yml adds them to the same release by hand.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, pack and draft the release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Check that the tag matches the project version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $csproj = Get-Content .\SpaceSharp\SpaceSharp.csproj -Raw
          if ($csproj -notmatch '<Version>([^<]+)</Version>') { throw "No <Version> in SpaceSharp.csproj" }
          $version = $Matches[1]
          $tag = "${{ github.ref_name }}"
          if ($version -ne $tag) { throw "Tag $tag does not match <Version>$version</Version>. Bump the version, commit, and tag that commit." }
          if (-not (Select-String -Path .\CHANGELOG.md -Pattern "^## $([regex]::Escape($version))\s*$" -Quiet)) {
            throw "CHANGELOG.md has no '## $version' heading. Take '(unreleased)' off it before tagging."
          }
          if (-not (Select-String -Path .\README.md -Pattern "badge/version-$([regex]::Escape($version))-" -Quiet)) {
            throw "The version badge in README.md does not say $version. Update it (img.shields.io/badge/version-$version-F5B82E) before tagging."
          }
          "Releasing SpaceSharp $version"

      # ---------------------------------------------------------------- stage 1: the app
      - name: Build
        shell: pwsh
        run: .\installer\release.ps1 -Stage Build

      # ---------------------------------------------------------------- stage 2: the installers
      - name: Pack
        shell: pwsh
        run: .\installer\release.ps1 -Stage Pack

      - name: Keep the release assets with the run
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: Releases
          if-no-files-found: error

      # ---------------------------------------------------------------- stage 3: the draft release
      - name: Create the draft release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\installer\release.ps1 -Stage Upload
