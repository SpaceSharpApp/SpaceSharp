name: Tests

# Test only. This workflow never publishes, packs or uploads anything built from SpaceSharp;
# releases come from release.yml when a version tag is pushed.

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'tools/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'tools/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run the test suite
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test .\SpaceSharp.Tests\SpaceSharp.Tests.csproj --configuration Release

  avalonia:
    name: Build the cross-platform app
    # The Avalonia front end must build on every platform it is meant for, so this runs on all three; it is a
    # build only, since the project has no tests of its own yet.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build SpaceSharp.Avalonia/SpaceSharp.Avalonia.csproj --configuration Release
