name: Tests

# Test only. This is the only workflow: it never publishes, packs or uploads anything built from SpaceSharp.
# Releases are built and signed on the developer's PC with installer\release.ps1.

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'tools/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'tools/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    # The app is for all three desktops, so the build and the tests run on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test SpaceSharp.Tests/SpaceSharp.Tests.csproj --configuration Release
